plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def serverRootDir = file("${projectDir}/../..").canonicalFile
def polymerSourceAssetsDir = file("${serverRootDir}/polymer/source_assets")
def rendererBotTemplateDir = file("${serverRootDir}/run-renderer-bot")
def rendererBotRunDir = file("${buildDir}/dev-runtime/renderer-bot").canonicalFile
def skinRestorerJars = fileTree(dir: "${serverRootDir}/mods", include: "skinrestorer-*.jar")
def tabJars = fileTree(dir: "${serverRootDir}/mods", include: "TAB*.jar")
def voicechatJars = fileTree(dir: "${serverRootDir}/mods", include: "voicechat-fabric-*.jar")
def webcamJars = fileTree(dir: "${serverRootDir}/mods", include: "webcam-fabric-*.jar")
def skinRestorerNestedLibDir = file("${buildDir}/skinrestorer-libs")
def skinRestorerJavaClientJars = fileTree(dir: skinRestorerNestedLibDir, include: "java-client-*.jar")
def rendererBotNameProp = providers.systemProperty("lg2.rendererBotName").orElse("RendererBot")
def rendererBotServerProp = providers.systemProperty("lg2.rendererBotServer").orElse("127.0.0.1:25565")
def cameraMediaCacheRoot = file("${serverRootDir}/cache/lg2-camera").canonicalFile

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
	maven {
		name = "Ladysnake Releases"
		url = "https://maven.ladysnake.org/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lg2" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		named("server") {
			runDir("../../")
			vmArgs("-Xms8G", "-Xmx8G")
		}

		rendererBotClient {
			inherit client
			configName = "Renderer Bot Client"
			ideConfigGenerated = true
			runDir(rendererBotRunDir.absolutePath)
			vmArgs(
					"-Xms4G",
					"-Xmx4G",
					"-Dlg2.rendererBot=true",
					"-Dlg2.rendererBotName=${rendererBotNameProp.get()}",
					"-Dlg2.rendererBotServer=${rendererBotServerProp.get()}",
					"-Dlg2.cameraMediaCacheRoot=${cameraMediaCacheRoot.absolutePath}"
			)
			programArg("--offlineDeveloperMode")
			programArg("--username=${rendererBotNameProp.get()}")
			programArg("--width=960")
			programArg("--height=540")
			client()
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "eu.pb4:polymer-core:${project.polymer_version}"
	modImplementation "eu.pb4:polymer-blocks:${project.polymer_version}"
	modImplementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	modImplementation files(skinRestorerJars)
	compileOnly files(tabJars)
	modCompileOnly files(voicechatJars)
	modCompileOnly files(webcamJars)
	modRuntimeOnly files(voicechatJars)
	modRuntimeOnly files(webcamJars)
	implementation files(
			"libs/flow-math-1.0.3.jar",
			"libs/bluenbt-3.5.0.jar"
	)
	runtimeOnly files(skinRestorerJavaClientJars)
	modRuntimeOnly files("${serverRootDir}/mods/cardinal-components-api-${project.cardinal_components_version}.jar")
	
}

tasks.register("prepareRendererBotClientRunDir", Copy) {
	onlyIf { rendererBotTemplateDir.isDirectory() }
	from(rendererBotTemplateDir) {
		exclude(
				".fabric/**",
				"logs/**",
				"debug/**",
				"crash-reports/**",
				"downloads/**",
				"polymer/resource_pack.zip",
				"options.txt",
				"servers.dat",
				"servers.dat_old",
				"data/fabric_default_resource_packs.json",
				"config/voicechat/category-volumes.properties",
				"config/voicechat/player-volumes.properties",
				"config/voicechat/username-cache.json",
				"config/webcam/blocked_sources.json"
		)
	}
	into(rendererBotRunDir)
	includeEmptyDirs = true
}

tasks.register("extractSkinRestorerNestedLibraries", Copy) {
	from({
		skinRestorerJars.files.collect { zipTree(it) }
	})
	include("META-INF/jars/java-client-*.jar")
	eachFile { it.path = it.name }
	includeEmptyDirs = false
	into(skinRestorerNestedLibDir)
}

tasks.register("prepareDevResourcePack", Sync) {
	from(layout.projectDirectory.dir("resourcepack"))
	from(layout.projectDirectory.dir("src/main/resources/assets")) {
		into("assets")
		exclude("lg2/textures/monitor/ui_icons/**")
	}
	// Resource-pack overrides (e.g. lang keys for pack users) must win over base assets.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	into(polymerSourceAssetsDir)
	includeEmptyDirs = true
}

tasks.matching { it.name == "runServer" }.configureEach {
	dependsOn(tasks.named("prepareDevResourcePack"))
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
}

tasks.matching { it.name == "runRendererBotClient" }.configureEach {
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
	dependsOn(tasks.named("prepareRendererBotClientRunDir"))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("test", Test) {
	failOnNoDiscoveredTests = false
}

tasks.register("runDronePhysicsSimulationTest", JavaExec) {
	group = "verification"
	description = "Runs the standalone drone physics simulation checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.DronePhysicsSimulationTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runMonitorMediaStateMachineTest", JavaExec) {
	group = "verification"
	description = "Runs monitor media session, queue, and stale-load regression checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.MonitorMediaStateMachineTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.named("check") {
	dependsOn(tasks.named("runDronePhysicsSimulationTest"))
	dependsOn(tasks.named("runMonitorMediaStateMachineTest"))
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
